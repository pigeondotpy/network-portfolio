<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ricardo Pearce | Core Network Engineer</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100d}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="portfolio" src="/index.html" title="Ricardo Pearce portfolio"></iframe>
<script>
const frame=document.getElementById('portfolio');
frame.addEventListener('load',()=>{
 const doc=frame.contentDocument||frame.contentWindow.document;
 const printButton=Array.from(doc.querySelectorAll('.nav-actions button')).find(btn=>btn.textContent.trim()==='Print CV');
 if(printButton){const a=doc.createElement('a');a.className=printButton.className;a.href='/Ricardo_Pearce_CV.pdf';a.download='Ricardo_Pearce_CV.pdf';a.textContent='Download CV';printButton.replaceWith(a);}
 const heroEyebrow=doc.querySelector('.hero .eyebrow');if(heroEyebrow)heroEyebrow.innerHTML='<span class="dot"></span> Portuguese EU Citizen · Relocating to the Netherlands · Full EU Work Rights · No Sponsorship Required';
 const heroP=doc.querySelector('.hero p');if(heroP)heroP.textContent='ISP core network engineer focused on routing, peering, automation, data centre infrastructure, SD WAN, network security, wireless and observability. Hands on across Juniper and Fortinet platforms, BGP, OSPF and production change work.';

 Array.from(doc.querySelectorAll('#stack .stack')).forEach(card=>{if(/Go\s*\/\s*NMS|NMS Prototyping|Concurrent polling/i.test(card.textContent))card.remove();});
 Array.from(doc.querySelectorAll('#automation article.card')).forEach(card=>{if(/NMS prototype|Go based|Go workers/i.test(card.textContent))card.remove();});
 Array.from(doc.querySelectorAll('#projects article.project')).forEach(card=>{if(/Go based NMS prototype|goroutine worker pool|VictoriaMetrics time series/i.test(card.textContent))card.remove();});
 Array.from(doc.querySelectorAll('#depth .skillline')).forEach(row=>{if(/^Go$/i.test(row.querySelector('span')?.textContent.trim()||''))row.remove();});

 const depthIntro=doc.querySelector('#depth .section-head p');if(depthIntro)depthIntro.textContent='A practical view of the technologies I use in production and the areas where I have hands on engineering experience.';
 Array.from(doc.querySelectorAll('#depth .skillline')).forEach(row=>{const label=row.querySelector('span:last-child');if(label)label.remove();});
 const growing=Array.from(doc.querySelectorAll('#depth .exposure-col')).find(col=>col.querySelector('h3')?.textContent.trim()==='Growing depth');if(growing)growing.querySelector('h3').textContent='Additional experience';

 const saicom=Array.from(doc.querySelectorAll('#experience article.role')).find(role=>role.querySelector('.company')?.textContent.trim()==='Saicom');
 if(saicom){const ul=saicom.querySelector('ul');if(ul)ul.innerHTML='<li>Operate and evolve production ISP core infrastructure, with hands on responsibility for Juniper routing, BGP policy, internet peering, OSPF, BFD, VRRP and service availability.</li><li>Own complex incident investigation across the routing and transport stack, using protocol state, telemetry, logs and path testing to isolate faults and restore stable service.</li><li>Plan and execute high risk production changes including core migrations, peering changes, regional link upgrades, POP and data centre deployments, switch refreshes and routing policy changes.</li><li>Work directly with internet exchange and upstream connectivity, route advertisement and aggregation, IPv4 and IPv6 routing, and improvements to convergence and failover behaviour.</li><li>Support and troubleshoot Fortinet SD WAN, ADVPN and HA environments while developing operational tooling, telemetry and monitoring improvements.</li><li>Currently strengthening anti DDoS capabilities through improved traffic visibility, detection and mitigation approaches including BGP FlowSpec and upstream mitigation options.</li>';}

 const incident=Array.from(doc.querySelectorAll('#projects article.project')).find(card=>card.querySelector('h3')?.textContent.trim()==='Core router BGP and BFD outage');
 if(incident){const p=incident.querySelector('p');if(p)p.textContent='Investigated BGP and BFD instability within the ISP core, tracing intermittent adjacency failures to an MTU mismatch on the backup link. Correcting the path MTU restored stable routing and failover behaviour.';const metric=incident.querySelector('.metric span:last-child');if(metric)metric.textContent='Root cause · MTU mismatch on backup link';}

 const dc=Array.from(doc.querySelectorAll('#projects article.project')).find(card=>card.querySelector('h3')?.textContent.trim()==='New data centre deployment');if(dc){const p=dc.querySelector('p');if(p)p.textContent='Stood up switching infrastructure for a new data centre, initially configuring Cisco Nexus before the platform was replaced with Arista switching. Worked through Layer 2 design, LACP and deployment troubleshooting.';const tags=dc.querySelector('.tagrow');if(tags)tags.innerHTML='<span class="tag">Arista</span><span class="tag">Cisco Nexus</span><span class="tag">LACP</span><span class="tag">Data Centre</span>';}
 const ddos=Array.from(doc.querySelectorAll('#projects article.project')).find(card=>card.querySelector('h3')?.textContent.trim()==='DDoS mitigation pipeline');if(ddos){const p=ddos.querySelector('p');if(p)p.textContent='Currently strengthening Saicom\'s anti DDoS capabilities, evaluating traffic visibility, detection and mitigation approaches including FlowSpec and upstream mitigation options.';const tags=ddos.querySelector('.tagrow');if(tags)tags.innerHTML='<span class="tag">DDoS</span><span class="tag">FlowSpec</span><span class="tag">BGP</span><span class="tag">Traffic Analysis</span>';}

 const certs=doc.querySelector('#certs .certs');if(certs)certs.innerHTML='<div class="cert"><b>Cisco CCNP ENCOR</b><span>Enterprise Core networking</span><div class="status">COMPLETED</div></div><div class="cert"><b>Juniper JNCIP-SP</b><span>Service Provider Routing and Switching</span><div class="status">COMPLETED</div></div><div class="cert"><b>Juniper JNCIS-ENT</b><span>Enterprise Routing and Switching</span><div class="status">COMPLETED</div></div><div class="cert"><b>CCIE Enterprise Infrastructure</b><span>Lab preparation in progress</span><div class="status">IN PROGRESS</div></div><div class="cert"><b>Fortinet FCA</b><span>Fortinet fundamentals and product knowledge</span><div class="status">COMPLETED</div></div><div class="cert"><b>Fortinet FCP Network Security</b><span>Network security track</span><div class="status">IN PROGRESS</div></div>';

 if(Array.isArray(frame.contentWindow.scenarioSteps)){
  frame.contentWindow.scenarioSteps.splice(0,frame.contentWindow.scenarioSteps.length,
   ['ALERT','Routing adjacency is unstable. User impact is intermittent.'],
   ['OBSERVE','BFD is flapping. Confirm whether BFD is the cause or only the messenger.'],
   ['ISOLATE','Compare the primary and backup transport paths and identify what changes when traffic fails over.'],
   ['VALIDATE','Path testing reveals different MTU behaviour on the backup link.'],
   ['ROOT CAUSE','An MTU mismatch on the backup link is causing instability when traffic uses the failover path.'],
   ['REMEDIATE','Align the MTU across the backup path and verify stable BGP, BFD and failover behaviour.']
  );
  frame.contentWindow.scenarioIndex=0;
  frame.contentWindow.renderScenario();
 }
 Array.from(doc.querySelectorAll('body *')).forEach(el=>{if(el.children.length===0&&/address family mismatch|AFI mismatch/i.test(el.textContent))el.textContent=el.textContent.replace(/Peer configuration reveals an address family mismatch adding unnecessary protocol behaviour\.?/gi,'An MTU mismatch on the backup link is identified as the root cause.').replace(/an AFI mismatch between iBGP peers/gi,'an MTU mismatch on the backup link');});
});
</script>
</body>
</html>
