<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Ricardo Pearce | Core Network Engineer</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100d}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="portfolio" src="/index.html" title="Ricardo Pearce portfolio"></iframe><script>
const frame=document.getElementById('portfolio');frame.addEventListener('load',()=>{const doc=frame.contentDocument||frame.contentWindow.document;
const pb=Array.from(doc.querySelectorAll('.nav-actions button')).find(b=>b.textContent.trim()==='Print CV');if(pb){const a=doc.createElement('a');a.className=pb.className;a.href='/Ricardo_Pearce_CV.pdf';a.download='Ricardo_Pearce_CV.pdf';a.textContent='Download CV';pb.replaceWith(a)}
const he=doc.querySelector('.hero .eyebrow');if(he)he.innerHTML='<span class="dot"></span> Portuguese EU Citizen · Relocating to the Netherlands · Full EU Work Rights · No Sponsorship Required';const hp=doc.querySelector('.hero p');if(hp)hp.textContent='ISP core network engineer focused on routing, peering, automation, data centre infrastructure, SD WAN, network security, wireless and observability. Hands on across Juniper and Fortinet platforms, BGP, OSPF and production change work.';

const di=doc.querySelector('#depth .section-head p');if(di)di.textContent='A practical view of the technologies I use in production and the areas where I have hands on engineering experience.';Array.from(doc.querySelectorAll('#depth .skillline')).forEach(r=>{const l=r.querySelector('span:last-child');if(l)l.remove()});const gr=Array.from(doc.querySelectorAll('#depth .exposure-col')).find(c=>c.querySelector('h3')?.textContent.trim()==='Growing depth');if(gr)gr.querySelector('h3').textContent='Additional experience';
const sa=Array.from(doc.querySelectorAll('#experience article.role')).find(r=>r.querySelector('.company')?.textContent.trim()==='Saicom');if(sa){const ul=sa.querySelector('ul');if(ul)ul.innerHTML='<li>Operate and evolve production ISP core infrastructure, with hands on responsibility for Juniper routing, BGP policy, internet peering, OSPF, BFD, VRRP and service availability.</li><li>Own complex incident investigation across the routing and transport stack, using protocol state, telemetry, logs and path testing to isolate faults and restore stable service.</li><li>Plan and execute high risk production changes including core migrations, peering changes, regional link upgrades, POP and data centre deployments, switch refreshes and routing policy changes.</li><li>Work directly with internet exchange and upstream connectivity, route advertisement and aggregation, IPv4 and IPv6 routing, and improvements to convergence and failover behaviour.</li><li>Support and troubleshoot Fortinet SD WAN, ADVPN and HA environments while developing operational tooling, telemetry and monitoring improvements.</li><li>Currently strengthening anti DDoS capabilities through improved traffic visibility, detection and mitigation approaches including BGP FlowSpec and upstream mitigation options.</li>'}
const inc=Array.from(doc.querySelectorAll('#projects article.project')).find(c=>c.querySelector('h3')?.textContent.trim()==='Core router BGP and BFD outage');if(inc){const p=inc.querySelector('p');if(p)p.textContent='Investigated BGP and BFD instability on a peering path, tracing the issue to an MTU mismatch where the backup link had a lower MTU configured than the primary path. Aligning the MTU restored stable BGP and BFD behaviour.';const m=inc.querySelector('.metric span:last-child');if(m)m.textContent='Root cause · lower MTU configured on backup link'}
const dc=Array.from(doc.querySelectorAll('#projects article.project')).find(c=>c.querySelector('h3')?.textContent.trim()==='New data centre deployment');if(dc){const p=dc.querySelector('p');if(p)p.textContent='Stood up switching infrastructure for a new data centre, initially configuring Cisco Nexus before the platform was replaced with Arista switching. Worked through Layer 2 design, LACP and deployment troubleshooting.';const t=dc.querySelector('.tagrow');if(t)t.innerHTML='<span class="tag">Arista</span><span class="tag">Cisco Nexus</span><span class="tag">LACP</span><span class="tag">Data Centre</span>'}
const dd=Array.from(doc.querySelectorAll('#projects article.project')).find(c=>c.querySelector('h3')?.textContent.trim()==='DDoS mitigation pipeline');if(dd){const p=dd.querySelector('p');if(p)p.textContent='Currently strengthening Saicom\'s anti DDoS capabilities, evaluating traffic visibility, detection and mitigation approaches including FlowSpec and upstream mitigation options.';const t=dd.querySelector('.tagrow');if(t)t.innerHTML='<span class="tag">DDoS</span><span class="tag">FlowSpec</span><span class="tag">BGP</span><span class="tag">Traffic Analysis</span>'}

const steps=[['ALERT','BGP peering becomes unstable when traffic moves to the backup link.'],['OBSERVE','BFD begins flapping on the backup path while the primary path remains stable.'],['ISOLATE','Compare the primary and backup peering links, including interface and transport parameters.'],['VALIDATE','Path testing shows the backup link is operating with a lower MTU than the primary path.'],['ROOT CAUSE','The backup BGP peering link has a lower MTU configured, causing the instability during failover.'],['REMEDIATE','Align the MTU across the peering paths and verify stable BGP, BFD and failover behaviour.']];let idx=0;const box=doc.getElementById('scenarioConsole'),prog=doc.getElementById('scenarioProgress'),next=doc.getElementById('scenarioNext'),reset=doc.querySelector('#troubleshoot .scenario-controls .btn:not(.primary)');function render(){box.innerHTML=steps.slice(0,idx).map((s,i)=>'<div><span class="'+(i===idx-1?'good':'muted')+'">['+s[0]+']</span> '+s[1]+'</div>').join('');prog.textContent=idx+' / '+steps.length;next.textContent=idx===0?'Start investigation':(idx===steps.length?'Investigation complete':'Next step')}if(next){next.removeAttribute('onclick');next.onclick=()=>{if(idx<steps.length){idx++;render()}}}if(reset){reset.removeAttribute('onclick');reset.onclick=()=>{idx=0;render()}}render();
